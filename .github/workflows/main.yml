name: My Node Workflow

on: 
    push: 
        branches: 
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Show files
              run: ls
            
            - name: Run node app
              run: node index.js

            - name: Print Current Directory
              run: pwd

            - name: Say Hello
              run: echo "Someone's is learning devOps, Let's GO!!"